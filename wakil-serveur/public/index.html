<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wakil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Familjen+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F4F7FA;--surface:#FFFFFF;--ink:#12263A;--ink2:#556A80;--line:#DCE5EE;
  --blue:#1B64C8;--blue-soft:#E3EEFB;--onblue:#FFFFFF;
  --amber:#96590A;--amber-soft:#FBEED6;--green:#17724C;--green-soft:#DDF1E6;
  --teal:#1E6F80;--teal-soft:#DAEFF2;--indigo:#3345A8;--indigo-soft:#E4E7F8;
  --red:#B03521;--red-soft:#FBE6E1;--grey:#5F7183;--grey-soft:#E8EDF2;
  --font:"Familjen Grotesk","Cairo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1926;--surface:#132435;--ink:#E7EEF5;--ink2:#9DB0C3;--line:#243B52;
    --blue:#6EA6F2;--blue-soft:#173251;--onblue:#0D1926;
    --amber:#F0B75A;--amber-soft:#3A2B10;--green:#5FD09B;--green-soft:#123527;
    --teal:#63C6DA;--teal-soft:#123339;--indigo:#9FADF2;--indigo-soft:#1F2650;
    --red:#F39A88;--red-soft:#41211B;--grey:#9DB0C3;--grey-soft:#1C2F42;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1926;--surface:#132435;--ink:#E7EEF5;--ink2:#9DB0C3;--line:#243B52;
  --blue:#6EA6F2;--blue-soft:#173251;--onblue:#0D1926;
  --amber:#F0B75A;--amber-soft:#3A2B10;--green:#5FD09B;--green-soft:#123527;
  --teal:#63C6DA;--teal-soft:#123339;--indigo:#9FADF2;--indigo-soft:#1F2650;
  --red:#F39A88;--red-soft:#41211B;--grey:#9DB0C3;--grey-soft:#1C2F42;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--font);font-variant-numeric:tabular-nums}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.i{width:22px;height:22px;flex:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top-in{max-width:560px;margin:0 auto;padding:12px 16px 8px;display:flex;align-items:center;gap:10px}
.mark{width:32px;height:32px;border-radius:10px;background:var(--blue);color:var(--onblue);display:grid;place-items:center;font:700 20px/1 var(--font)}
.top h1{font-size:24px;font-weight:600;letter-spacing:-.01em;flex:1}
main{max-width:560px;margin:0 auto;padding:4px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.sub{color:var(--ink2);margin:0 0 14px}
.sub::first-letter{text-transform:uppercase}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:flex}
.tabs button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;background:none;border:0;color:var(--ink2);font-size:12px;font-weight:500;cursor:pointer}
.tabs button.on{color:var(--blue);font-weight:600}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}

.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--blue);background:var(--blue);color:var(--onblue);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--blue);border-color:var(--line)}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn.danger{color:var(--red)}
.btn.full{width:100%}
.btn[aria-disabled="true"],.btn:disabled{opacity:.45;pointer-events:none}
.btn .i{width:18px;height:18px}
.link{background:none;border:0;padding:0;color:var(--blue);font-weight:600;text-decoration:underline;cursor:pointer}

.note{background:var(--blue-soft);color:var(--ink);border-radius:12px;padding:10px 12px;margin:0 0 14px;font-size:14px}
.empty{text-align:center;padding:36px 12px;display:grid;gap:10px;justify-items:center}
.empty h2{font-size:20px}.empty p{color:var(--ink2);max-width:32ch}
.mut{color:var(--ink2)}
.small{font-size:13px}

.grp2{margin:0 0 20px}
.grp2>h2{font-size:16px;font-weight:600;margin:0 2px 8px;display:flex;align-items:center;gap:8px}
.cnt{background:var(--grey-soft);color:var(--ink2);border-radius:999px;font-size:12.5px;padding:1px 8px}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list>li+li{border-top:1px solid var(--line)}
.row{padding:12px 14px}
.row.red{box-shadow:inset 3px 0 0 var(--red)}
.row.amber{box-shadow:inset 3px 0 0 var(--amber)}
.rmain{display:block;width:100%;background:none;border:0;padding:0;text-align:start;cursor:pointer}
.rmain .t{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.rmain .t b{font-weight:600;font-size:16px}
.rmain .s{display:block;color:var(--ink2);font-size:14px;margin-top:2px}
.rmain .ex{display:block;font-size:13px;margin-top:4px;color:var(--amber)}
.rmain .ex.r{color:var(--red)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

.chip{display:inline-flex;align-items:center;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:600;white-space:nowrap}
.c-amber{background:var(--amber-soft);color:var(--amber)}.c-blue{background:var(--blue-soft);color:var(--blue)}
.c-teal{background:var(--teal-soft);color:var(--teal)}.c-indigo{background:var(--indigo-soft);color:var(--indigo)}
.c-green{background:var(--green-soft);color:var(--green)}.c-red{background:var(--red-soft);color:var(--red)}
.c-grey{background:var(--grey-soft);color:var(--grey)}

.search{width:100%;min-height:44px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;margin:0 -16px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fc{flex:none;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;cursor:pointer}
.fc span{color:var(--ink2);margin-inline-start:4px}
.fc.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.fc.on span{color:inherit;opacity:.7}

.orow{display:block;width:100%;background:none;border:0;padding:12px 14px;text-align:start;cursor:pointer}
.orow .o1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.orow .o1 b{font-weight:600}
.orow .o2{color:var(--ink2);font-size:14px;margin-top:2px}
.orow .o3{display:flex;align-items:center;gap:12px;margin-top:10px}
.orow .o3 .rail{width:120px;flex:none}
.orow .o3 .mut{font-size:13px}

.rail{--sz:12px;--pt:0px;display:flex;list-style:none;margin:0;padding:0}
.rail.big{--sz:24px;--pt:4px;margin:6px 0 4px}
.rail.side{opacity:.45}
.rail li{flex:1;position:relative;min-width:0}
.rail li::before{content:"";position:absolute;left:-50%;width:100%;top:calc(var(--pt) + var(--sz)/2 - 1.5px);height:3px;background:var(--line)}
.rail li:first-child::before{display:none}
.rail li.done::before,.rail li.cur::before{background:var(--blue)}
.stopbtn{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;padding:var(--pt) 0 0;background:none;border:0;color:inherit}
.rail.big .stopbtn{min-height:68px;cursor:pointer}
.stop{position:relative;z-index:1;width:var(--sz);height:var(--sz);border-radius:50%;background:var(--surface);border:3px solid var(--line)}
.rail li.done .stop{background:var(--blue);border-color:var(--blue)}
.rail li.cur .stop{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
.rail.big li.done .stop::after{content:"";position:absolute;left:32%;top:12%;width:26%;height:50%;border:solid var(--onblue);border-width:0 2.5px 2.5px 0;transform:rotate(40deg)}
.rail .lb{font-size:12px;color:var(--ink2);text-align:center;line-height:1.2}
.rail li.cur .lb{color:var(--ink);font-weight:600}
.rail:not(.big) .lb{display:none}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.stats div{background:var(--surface);padding:12px 14px}
.stats b{display:block;font-size:22px;font-weight:600}.stats span{font-size:13px;color:var(--ink2)}

.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(8,22,36,.55)}
.panel{position:relative;width:100%;max-width:560px;max-height:93%;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -12px 40px rgba(8,22,36,.25);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(28px);opacity:0}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.ph{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:10px}
.ph h2{font-size:22px;font-weight:600;letter-spacing:-.01em}
.x{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--ink2)}
.warns{display:grid;gap:6px;margin:0 0 10px}
.warns div{background:var(--red-soft);color:var(--red);border-radius:10px;padding:8px 10px;font-size:14px}
.warns div.i2{background:var(--amber-soft);color:var(--amber)}
.h3{font-size:15px;font-weight:600;margin:18px 0 8px}
.f{display:block;margin:0 0 12px}
.f>span{display:block;font-size:13px;color:var(--ink2);margin-bottom:4px}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
textarea{resize:vertical;line-height:1.45}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.inl{display:flex;gap:8px;align-items:end}.inl .f{flex:1}
.zone{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.tl{list-style:none;margin:0;padding:0;font-size:13px;color:var(--ink2)}
.tl li{padding:4px 0;border-top:1px solid var(--line)}
.seg{display:flex;background:var(--grey-soft);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;min-height:38px;border:0;background:none;border-radius:9px;font-weight:600;font-size:14px;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink)}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin-top:6px}
.chk input{width:20px;min-height:20px;height:20px}

.chatlog{display:flex;flex-direction:column;gap:8px;min-height:220px;max-height:50vh;overflow:auto;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.b{max-width:84%;padding:9px 12px;border-radius:16px;white-space:pre-wrap;word-break:break-word}
.b.client{align-self:flex-end;background:var(--blue);color:var(--onblue);border-end-end-radius:4px}
.b.agent{align-self:flex-start;background:var(--grey-soft);border-end-start-radius:4px}
.sys{align-self:center;display:flex;gap:8px;align-items:center;font-size:13px;padding:5px 10px;border-radius:999px;text-align:center}
.sys.ok{background:var(--green-soft);color:var(--green)}.sys.warn{background:var(--amber-soft);color:var(--amber)}.sys.err{background:var(--red-soft);color:var(--red)}
.quick{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;cursor:pointer}
.composer{display:flex;gap:8px}.composer input{flex:1}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--ink2);animation:bl 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}}

.grp{margin:0 0 22px}.grp>h3{font-size:16px;font-weight:600;margin-bottom:10px}
.prod{border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;background:var(--surface)}
.prow{display:flex;gap:8px;margin-bottom:8px}.prow input:nth-child(2){width:96px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:start;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink2);font-size:13px}tr:last-child td{border-bottom:0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px)}
.b.in{align-self:flex-start;background:var(--grey-soft)}
.b.out{align-self:flex-end;background:var(--blue);color:var(--onblue)}
.b small{display:block;font-size:11px;opacity:.7;margin-top:4px}
.draft{background:var(--amber-soft);border-radius:14px;padding:10px;margin-top:12px}
.draft textarea{background:var(--surface)}
.seg{overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}.seg button{white-space:nowrap;padding:0 10px}
.fix{display:block;margin-top:6px;background:none;border:0;padding:0;color:var(--blue);font-size:12px;font-weight:600;cursor:pointer;text-decoration:underline}
.sys .link{margin-inline-start:4px}

:root{--navh:60px}
.top-in{gap:12px}
.back{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:28px;line-height:1;cursor:pointer;color:var(--ink);padding:0 0 3px}
.note{font-size:14px}
.lead{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:0 0 20px}
.lead-n{font-size:40px;font-weight:700;line-height:1;color:var(--blue);min-width:44px;text-align:center}
.lead.done .lead-n{color:var(--green)}
.lead b{display:block;font-size:17px;font-weight:600}
.lead span{color:var(--ink2);font-size:14px}
.grp2>h2{font-size:15px;color:var(--ink2)}
.row{padding:14px}
.racts{display:flex;gap:8px;margin-top:12px}
.racts .btn{flex:1;min-width:0;padding:0 8px;white-space:nowrap}
.rmain .t b{font-size:17px}
.hub{display:grid;gap:10px}
.hubrow{display:flex;align-items:center;gap:14px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:start;cursor:pointer}
.hubrow .ic{width:46px;height:46px;border-radius:14px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;flex:none}
.hubrow b{display:block;font-size:16.5px;font-weight:600}
.hubrow span span{color:var(--ink2);font-size:14px}
.hubrow>.i:last-child{margin-inline-start:auto;color:var(--ink2);width:20px;height:20px}
.tip{margin:0 0 12px;font-size:14px;color:var(--ink2)}
.tip summary{cursor:pointer;color:var(--blue);font-weight:600;list-style:none}
.tip summary::-webkit-details-marker{display:none}
.tip p{margin:8px 0 0;background:var(--blue-soft);border-radius:12px;padding:10px 12px;color:var(--ink)}
.chatbar{display:flex;gap:8px;align-items:center;margin:0 0 10px}
select.mini{width:auto;min-height:38px;padding:6px 10px;font-size:15px}
.chatlog.flow{max-height:none;overflow:visible;border:0;background:none;padding:0;min-height:18vh}
.dock{position:sticky;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px));z-index:5;background:var(--bg);padding:8px 0 10px;margin-top:10px}
.dock .quick{padding:0 0 8px}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:0 0 10px}
.acc.flat{background:var(--bg)}
.acc>summary{list-style:none;padding:14px 16px;font-weight:600;font-size:16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:"›";font-size:24px;line-height:1;color:var(--ink2);transform:rotate(90deg);flex:none}
.acc[open]>summary::after{transform:rotate(-90deg)}
.acc summary small{display:block;font-weight:400;color:var(--ink2);font-size:13.5px;margin-top:2px}
.accb{padding:0 16px 14px}
.contact{display:flex;gap:10px;margin:0 0 12px}.contact .btn{flex:1}
.foot{position:sticky;bottom:0;z-index:3;background:var(--surface);border-top:1px solid var(--line);margin:14px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.foot:empty{display:none}
.meta{display:flex;gap:8px;align-items:center;margin:-4px 0 10px;color:var(--ink2);font-size:14px}
.connrow{display:block;width:100%;text-align:start;background:none;border:0;padding:0;margin:0 0 14px;cursor:pointer}
.connrow .chip{margin:0 6px 6px 0}
.whurl{margin:0 0 14px}
.whurl>span{display:block;font-size:13px;color:var(--ink2);margin-bottom:4px}
.whrow{display:flex;gap:8px;align-items:center}
.whrow code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px}
</style>
</head>
<body>
<header class="top"><div class="top-in"><button class="back" id="backb" data-act="agtab:hub" aria-label="Retour" hidden>‹</button><span class="mark" aria-hidden="true">و</span><h1 id="title">Aujourd'hui</h1><div id="hact"></div></div></header>
<main id="view"></main>
<nav class="tabs" aria-label="Navigation"><div class="tabs-in" id="tabs"></div></nav>

<input type="file" id="photoInput" accept="image/*" hidden aria-hidden="true">
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
"use strict";
/* ============ Utilitaires ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

const GOUV=["Ariana","Béja","Ben Arous","Bizerte","Gabès","Gafsa","Jendouba","Kairouan","Kasserine","Kébili","Le Kef","Mahdia","Manouba","Médenine","Monastir","Nabeul","Sfax","Sidi Bouzid","Siliana","Sousse","Tataouine","Tozeur","Tunis","Zaghouan"];
const VILLES={"houmt souk":"Médenine","djerba":"Médenine","midoun":"Médenine","zarzis":"Médenine","ben gardane":"Médenine","medenine":"Médenine",
"moknine":"Monastir","monastir":"Monastir","ksar hellal":"Monastir","jemmal":"Monastir","sahline":"Monastir","ksibet el mediouni":"Monastir",
"msaken":"Sousse","sousse":"Sousse","kalaa kebira":"Sousse","hammam sousse":"Sousse","akouda":"Sousse","enfidha":"Sousse",
"tunis":"Tunis","la goulette":"Tunis","carthage":"Tunis","la marsa":"Tunis","le bardo":"Tunis","sidi bou said":"Tunis","le kram":"Tunis","lac 1":"Tunis","lac 2":"Tunis",

async function api(method,url,body){
  const r=await fetch(url,{method,headers:body!==undefined?{"content-type":"application/json"}:{},body:body!==undefined?JSON.stringify(body):undefined,credentials:"same-origin"});
  if(!r.ok){let m="";try{m=(await r.json()).error||"";}catch(e){}throw new Error(m||("Erreur "+r.status));}
  return(r.headers.get("content-type")||"").includes("json")?r.json():r;
}
let db=null,cfg={},snap={o:{},t:{},s:"",b:""},saveT=null,pushing=false,dirty=false,pollSig="";
const jstr=x=>JSON.stringify(x);
function normalize(st){
  db={settings:{...DEF,...st.settings},orders:st.orders||[],tickets:st.tickets||[],blacklist:st.blacklist||[],exports:st.exports||[],convs:st.convs||[]};
  db.settings.tpl={ar:{...TPL.ar,...(db.settings.tpl?.ar||{})},fr:{...TPL.fr,...(db.settings.tpl?.fr||{})}};
  cfg=st.cfg||{};db.orders.forEach(o=>{o.events=o.events||[];});
  snap.o={};db.orders.forEach(o=>snap.o[o.id]=jstr(o));snap.t={};db.tickets.forEach(t=>snap.t[t.id]=jstr(t));
  snap.s=jstr(db.settings);snap.b=jstr(db.blacklist);
}
function save(){dirty=true;clearTimeout(saveT);saveT=setTimeout(push,250);}
async function push(){
  if(pushing){saveT=setTimeout(push,300);return;}
  const body={orders:[],delOrders:[],tickets:[],delTickets:[]},cur=new Set(),ct=new Set();
  db.orders.forEach(o=>{cur.add(String(o.id));const before=snap.o[o.id];if(before===jstr(o))return;
    const b=before?JSON.parse(before):{events:[]},patch={};
    for(const k of Object.keys(o)){if(k!=="events"&&jstr(o[k])!==jstr(b[k]))patch[k]=o[k];}
    body.orders.push({id:o.id,patch,evAdd:o.events.slice((b.events||[]).length)});});
  Object.keys(snap.o).forEach(id=>{if(!cur.has(id))body.delOrders.push(+id);});
  db.tickets.forEach(t=>{ct.add(String(t.id));const before=snap.t[t.id];if(before===jstr(t))return;
    const b=before?JSON.parse(before):{},patch={};for(const k of Object.keys(t)){if(jstr(t[k])!==jstr(b[k]))patch[k]=t[k];}
    body.tickets.push({id:t.id,patch});});
  Object.keys(snap.t).forEach(id=>{if(!ct.has(id))body.delTickets.push(+id);});
  if(snap.s!==jstr(db.settings))body.settings=db.settings;
  if(snap.b!==jstr(db.blacklist))body.blacklist=db.blacklist;
  pushing=true;
  try{await api("POST","/api/sync",body);
    db.orders.forEach(o=>snap.o[o.id]=jstr(o));Object.keys(snap.o).forEach(id=>{if(!cur.has(id))delete snap.o[id];});
    db.tickets.forEach(t=>snap.t[t.id]=jstr(t));Object.keys(snap.t).forEach(id=>{if(!ct.has(id))delete snap.t[id];});
    snap.s=jstr(db.settings);snap.b=jstr(db.blacklist);dirty=false;}
  catch(e){toast("Enregistrement impossible : "+e.message);}
  finally{pushing=false;}
}
async function poll(){
  if(dirty||pushing||document.hidden)return;
  try{
    const st=await api("GET","/api/state"),sig=jstr([st.orders,st.tickets,st.convs,st.settings,st.blacklist,st.exports,st.cfg]);
    if(dirty||pushing||sig===pollSig)return;
    pollSig=sig;normalize(st);sample=cfg.claude?true:null;renderSafe();
    if(ui.sheet?.type==="order"){const o=ord(ui.sheet.id);if(o)patchOrderSheet(o);}
  }catch(e){}
}
async function boot(){
  try{const st=await api("GET","/api/state");pollSig=jstr([st.orders,st.tickets,st.convs,st.settings,st.blacklist,st.exports,st.cfg]);normalize(st);sample=cfg.claude?true:null;dl=true;}
  catch(e){$("#view").innerHTML=`<div class="empty"><h2>Connexion impossible</h2><p>${esc(e.message)}</p></div>`;return;}
  render();routeHash();addEventListener("hashchange",routeHash);setInterval(poll,8000);document.addEventListener("visibilitychange",poll);
}

    due:open.filter(o=>o.status==="attente"&&!o.confirmAskedAt&&now-o.createdAt>=s.confirmAfterH*H),
    waiting:open.filter(o=>o.status==="attente"&&o.confirmAskedAt),
    fresh:open.filter(o=>o.status==="attente"&&!o.confirmAskedAt&&now-o.createdAt<s.confirmAfterH*H),
    pack:open.filter(o=>o.status==="confirmee"),

const ERR={not_granted:"Autorise l'accès à Claude pour tester l'agent.",rate_limited:"Trop de messages ou limite d'usage atteinte. Réessaie dans un moment.",session_expired:"Reconnecte-toi à Claude puis réessaie.",invalid_json:"L'agent a mal formaté sa réponse.",upstream_error:"Connexion interrompue.",empty_completion:"Pas de réponse de l'agent.",prompt_too_large:"La conversation est devenue trop longue : lance-en une nouvelle."};
function pushLog(x){
  if(x.k==="b"&&x.who==="agent"&&x.fix===undefined)x.fix=true;
  chat.log.push(x);const l=$("#chatlog");
  if(l){if(chat.log.length===1)l.innerHTML="";l.insertAdjacentHTML("beforeend",bubbleHTML(x));l.scrollTop=l.scrollHeight;if(l.id==="chatlog")window.scrollTo({top:document.documentElement.scrollHeight});}
}
function setTyping(on){
  const l=$("#chatlog");if(!l)return;const t=$("#typing");
  if(on&&!t){l.insertAdjacentHTML("beforeend",`<div class="b agent" id="typing"><span class="dots"><i></i><i></i><i></i></span></div>`);l.scrollTop=l.scrollHeight;}
  if(!on&&t)t.remove();
}
async function callAgent(text,retry){
  chat.busy=true;setTyping(true);
  try{
    const r=await api("POST","/api/test/send",{text,canal:chat.canal,retry:!!retry});setTyping(false);
    if(r.reply)pushLog({k:"b",who:"agent",text:r.reply});
    (r.events||[]).forEach(e=>pushLog(e.type==="order"?{k:"sys",cls:"ok",text:`Commande ${e.num} créée, à confirmer. `,btn:["open-order:"+e.id,"Ouvrir"]}:{k:"sys",cls:"warn",text:e.kind==="reclamation"?"Réclamation transmise : tu es alerté.":"Conversation à reprendre par toi."}));
    poll();
  }catch(e){setTyping(false);pushLog({k:"sys",cls:"err",text:(e.message||"Erreur")+" ",btn:["chat-retry","Renvoyer"]});}
  finally{chat.busy=false;}
}
function sendChat(text){
  text=String(text||"").trim();if(!text)return;
  if(tryTeach(text)){const i=$("#chatIn");if(i)i.value="";return;}
  if(chat.busy||!sample)return;
  chat.lastText=text;pushLog({k:"b",who:"client",text});const i=$("#chatIn");if(i)i.value="";callAgent(text,false);
}

const wordsOf=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").split(/[^\p{L}\p{N}]+/u).filter(w=>w.length>1);
function lessonsTxt(){
  const L=db.settings.lecons||[];if(!L.length)return"";
  const lastC=[...chat.log].reverse().find(x=>x.k==="b"&&x.who==="client"&&!x.name),q=new Set(wordsOf(lastC?.text));
  const sc=l=>{const w=new Set(wordsOf(l.situation));let n=0;w.forEach(x=>{if(q.has(x))n++;});return w.size&&q.size?n/Math.sqrt(w.size*q.size):0;};
  let pick=L;
  if(L.length>12){const best=[...L].sort((a,b)=>sc(b)-sc(a)).filter(l=>sc(l)>0).slice(0,8);pick=[...best,...L.filter(l=>!best.includes(l)).slice(0,12-best.length)];}
  return"\nCE QUE LE PROPRIÉTAIRE T'A APPRIS (priorité maximale pour le style, le vocabulaire et la façon de répondre ; les prix et infos du catalogue restent la référence)\n"+pick.map(l=>`Situation : ${l.situation}\nRéponse à donner : ${l.reponse}`).join("\n---\n")+"\nQuand une situation ressemble à l'une de celles-ci, réponds dans le même esprit, avec les mêmes mots et le même niveau de langue, sans recopier si les détails changent.\n";
}
const TEACH_RX=/^\s*r[ée]ponse\s+adapt[ée]e?\s*(?:pour\s+(.+?))?\s*[:：]\s*([\s\S]+)$/i;
function addLesson(situation,reponse){
  const l={id:"l"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),situation:String(situation).trim(),reponse:String(reponse).trim(),t:Date.now()};
  db.settings.lecons=db.settings.lecons||[];db.settings.lecons.unshift(l);if(db.settings.lecons.length>200)db.settings.lecons.length=200;save();return l;
}
function tryTeach(raw){
  const m=String(raw||"").match(TEACH_RX);if(!m)return false;
  const rep=m[2].trim().replace(/^[\(\[«"“]\s*/,"").replace(/\s*[\)\]»"”]$/,"").trim();
  let sit=(m[1]||"").trim();
  if(!sit){const lastC=[...chat.log].reverse().find(x=>x.k==="b"&&x.who==="client"&&!x.name);sit=lastC?lastC.text:"";}
  if(!rep){pushLog({k:"sys",cls:"warn",text:"Écris ta réponse après les deux-points."});return true;}
  if(!sit){pushLog({k:"sys",cls:"warn",text:"Écris d'abord un message de client, puis « réponse adaptée : » et ta réponse."});return true;}
  const l=addLesson(sit,rep);
  if(chat.turns){const la=[...chat.turns].reverse().find(t=>t.role==="agent");if(la)la.content=rep;}
  pushLog({k:"b",who:"client",text:String(raw).trim(),name:"Toi · leçon"});
  pushLog({k:"b",who:"agent",text:"Compris ✅ Je retiens cette façon de répondre. La prochaine fois, je répondrai comme ça.",name:"Agent",fix:false});
  pushLog({k:"sys",cls:"ok",text:`Leçon ${(db.settings.lecons||[]).length} enregistrée. `,btns:[["teach-retest:"+l.id,"Tester"],["appris","Voir mes leçons"]]});
  return true;
}
function vLessons(){
  const L=db.settings.lecons||[];
  return`<div class="note">Apprends à l'agent ta façon de répondre. Dans <b>Tester</b>, écris « réponse adaptée : » puis ta réponse : il la retient et s'en servira la prochaine fois. Tu peux aussi ajouter une leçon ici.</div>
  <section class="grp"><h3>Ajouter une leçon</h3>
  <label class="f"><span>Quand le client dit…</span><textarea id="lsit" dir="auto" rows="2" placeholder="Ex : قداش هذا؟"></textarea></label>

  <button class="btn" data-act="lesson-add">Enregistrer la leçon</button></section>
  <section class="grp"><h3>Ce que l'agent a appris (${L.length})</h3>${L.length?L.map(lessonHTML).join(""):`<p class="mut small">Aucune leçon pour l'instant.</p>`}</section>`;
}
const lessonHTML=l=>`<div class="prod" data-lid="${esc(l.id)}"><label class="f"><span>Quand le client dit…</span><textarea data-les="situation" dir="auto" rows="2">${esc(l.situation)}</textarea></label><label class="f"><span>L'agent répond…</span><textarea data-les="reponse" dir="auto" rows="3">${esc(l.reponse)}</textarea></label><div class="acts"><button class="btn sm ghost" data-act="teach-retest:${esc(l.id)}">Tester</button><button class="btn sm ghost danger" data-act="lesson-del:${esc(l.id)}">Supprimer</button></div></div>`;
async function retestLesson(id){
  const l=(db.settings.lecons||[]).find(x=>x.id===id);if(!l||!sample||chat.busy)return;

}

    if(d.f==="convUrl"){const a=$("#ocv"),u=safeUrl(v);if(a){a.hidden=!u;if(u)a.href=u;}}
    save();$("#warn").innerHTML=warnHTML(o);patchSums(o);if(d.f==="nom"){const t=$(".ph h2");if(t)t.textContent=o.nom||"Nouvelle commande";}
  }else if(d.tf&&ui.sheet?.type==="ticket"){
    const t=tic(ui.sheet.id);if(!t)return;let v=el.value;if(d.tf==="tel"){v=normPhone(v);el.value=v;}
    t[d.tf]=v;if(d.tf==="convUrl"){const a=$("#tcv"),u=safeUrl(v);if(a){a.hidden=!u;if(u)a.href=u;}}save();
  }else if(d.s){
    let v=el.type==="checkbox"?el.checked:el.value;
    if(["fraisLivraison","confirmAfterH","noReplyAfterH"].includes(d.s)){v=Number(v)||0;if(d.s==="confirmAfterH")v=Math.min(23,Math.max(1,v||20));if(d.s==="noReplyAfterH")v=Math.min(96,Math.max(1,v||24));el.value=v;}
    if(d.s==="monWa"){v=normPhone(v);el.value=v;}
    db.settings[d.s]=v;save();
  }else if(d.pf){
    const p=db.settings.produits.find(x=>x.id===el.closest("[data-pid]")?.dataset.pid);if(!p)return;
    p[d.pf]=d.pf==="actif"?el.checked:d.pf==="prix"?(Number(el.value)||0):el.value;save();
  }else if(d.les){
    const l=(db.settings.lecons||[]).find(x=>x.id===el.closest("[data-lid]")?.dataset.lid);if(l){l[d.les]=el.value;save();}
  }else if(d.tpl){
    const [l,k]=d.tpl.split(".");db.settings.tpl[l][k]=el.value;save();
  }else if(el.id==="chatCanal"){chat.canal=el.value;}
  else if(el.id==="dateEst"&&ui.sheet?.type==="msg"){
    const o=ord(ui.sheet.id);if(o&&el.value){o.dateEst=new Date(el.value+"T12:00:00").getTime();save();const t=buildMsg(o,"en_livraison",ui.sheet.lang);$("#msgText").value=t;$("#waBtn").href=waLink(o.tel,t);}
  }
});
document.addEventListener("change",e=>{
  if(e.target.id==="photoInput"){const f=e.target.files&&e.target.files[0];e.target.value="";if(f)orderFromPhoto(f);}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="q"){ui.q=el.value;$("#olist").innerHTML=ordersListHTML();}
  else if(el.id==="msgText"){const o=ord(ui.sheet?.id);if(o)$("#waBtn").href=waLink(o.tel,el.value);}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.id==="chatIn"&&!e.isComposing){e.preventDefault();sendChat(e.target.value);}
  if(e.key==="Escape"&&!$("#sheet").hidden)closeSheet();
});


/* ============ Messages ============ */
const chanLabel=c=>({instagram:"Instagram",facebook:"Facebook",whatsapp:"WhatsApp",test:"Test"}[c]||c);
function vMessages(){
  const cs=(db.convs||[]).filter(c=>!c.test).sort((a,b)=>b.updatedAt-a.updatedAt);
  if(!cs.length)return`<div class="empty"><h2>Aucune conversation</h2><p>Les messages reçus sur Instagram, Facebook et WhatsApp apparaissent ici, avec les brouillons de l'agent.</p></div>`;
  return`<ul class="list">${cs.map(c=>`<li><button class="orow" data-act="conv-open:${c.id}"><span class="o1"><b>${esc(c.name)}</b><span>${c.draft?'<span class="chip c-amber">Brouillon</span> ':""}${c.paused?'<span class="chip c-grey">À toi</span> ':""}${c.unread?`<span class="chip c-blue">${c.unread}</span>`:""}</span></span><span class="o2" dir="auto">${esc(c.last||"")}</span><span class="o3"><span class="mut">${chanLabel(c.channel)} · ${ago(c.updatedAt)}</span></span></button></li>`).join("")}</ul>`;
}
async function reloadConv(id){const c=await api("GET","/api/conv/"+id);renderConv(c);}
async function openConv(id){
  ui.sheet={type:"conv",id};openSheet(head("Conversation","…")+`<p class="mut">Chargement…</p>`);
  try{const c=await api("GET","/api/conv/"+id);if(ui.sheet?.type!=="conv"||ui.sheet.id!==id)return;renderConv(c);api("POST",`/api/conv/${id}/read`,{}).then(poll).catch(()=>{});}
  catch(e){$("#panel").innerHTML=head("Conversation","Erreur")+`<p class="mut">${esc(e.message)}</p>`;}
}
function renderConv(c){
  const orders=db.orders.filter(o=>o.convId===c.id),vis=c.turns.filter(t=>!t.draft),drafts=c.turns.filter(t=>t.draft);
  const when=t=>new Date(t).toLocaleString("fr-FR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
  openSheet(head(`${chanLabel(c.channel)} · ${c.paused?"tu as la main":"agent actif"}`,esc(c.name))+
   (orders.length?`<div class="acts" style="margin:0 0 10px">${orders.map(o=>`<button class="btn sm ghost" data-act="open-order:${o.id}">${num(o)} · ${ST[o.status].l}</button>`).join("")}</div>`:"")+
   `<div class="chatlog" id="convlog">${vis.map(t=>`<div class="b ${t.r==="client"?"in":"out"}" dir="auto">${esc(t.x)}<small>${t.r==="client"?"Client":t.r==="owner"?"Toi":"Agent"} · ${when(t.t)}${t.failed?" · non envoyé":""}</small></div>`).join("")||`<p class="mut small" style="margin:auto">Aucun message.</p>`}</div>`+
   drafts.map(t=>`<div class="draft"><div class="small mut">Brouillon de l'agent</div><textarea id="draft-${t.id}" dir="auto" rows="4">${esc(t.x)}</textarea><div class="acts"><button class="btn" data-act="draft-send:${c.id}:${t.id}">Envoyer</button><button class="btn ghost" data-act="draft-discard:${c.id}:${t.id}">Ignorer</button></div></div>`).join("")+
   `<label class="f" style="margin-top:12px"><span>Répondre moi-même</span><textarea id="convReply" dir="auto" rows="3" placeholder="Ton message…"></textarea></label>
   <div class="acts"><button class="btn" data-act="conv-reply:${c.id}">Envoyer</button><button class="btn ghost" data-act="conv-pause:${c.id}:${c.paused?0:1}">${c.paused?"Réactiver l'agent":"Reprendre la main"}</button></div>`);
  ui.sheet={type:"conv",id:c.id};const l=$("#convlog");if(l)l.scrollTop=l.scrollHeight;
}

/* ============ Rendu principal ============ */
const TITLES={today:"Aujourd'hui",orders:"Commandes",messages:"Messages",agent:"Agent",export:"Export"};
function refreshBadge(){const n=taskCount(),b=$("#badge");if(b){b.textContent=n;b.hidden=!n;}const m=(db.convs||[]).filter(c=>!c.test&&(c.unread||c.draft)).length,bm=$("#badge-m");if(bm){bm.textContent=m;bm.hidden=!m;}}
function render(){
  const subPage=ui.tab==="agent"&&ui.agentTab&&ui.agentTab!=="hub",SUBT={integrations:"Intégrations",tester:"Tester l'agent",appris:"Ce qu'il a appris",boutique:"Ma boutique",messages:"Messages types",simulation:"Simulation"};
  $("#title").textContent=subPage?(SUBT[ui.agentTab]||"Agent"):TITLES[ui.tab];$("#backb").hidden=!subPage;$(".mark").hidden=subPage;
  $("#hact").innerHTML=ui.tab==="orders"?`<button class="btn sm ghost" data-act="order-photo">Depuis une capture</button><button class="btn sm" data-act="new-order">${I.plus}Commande</button>`:"";
  $("#view").innerHTML={today:vToday,orders:vOrders,messages:vMessages,agent:vAgent,export:vExport}[ui.tab]();
  $("#tabs").innerHTML=[["today","Aujourd'hui"],["orders","Commandes"],["messages","Messages"],["agent","Agent"],["export","Export"]].map(([k,l])=>`<button data-act="tab:${k}" class="${ui.tab===k?"on":""}"${ui.tab===k?' aria-current="page"':""}>${I[k]}<span>${l}</span>${k==="today"?`<span class="badge" id="badge" hidden></span>`:k==="messages"?`<span class="badge" id="badge-m" hidden></span>`:""}</button>`).join("");
  refreshBadge();
  const l=$("#chatlog");if(l)l.scrollTop=l.scrollHeight;
}
function renderSafe(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;render();}
boot();
</script>
